name: ROS validation

# Same split as build-and-test: unqualified `push` alongside `pull_request`
# ran this twice for every PR commit.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The same script a contributor runs locally, so the two cannot drift.
      # That drift is exactly what let 17 unattributed files reach CI: `./ros
      # validate` alone checks the working tree, and only CI was passing
      # ROS_BASE_REF to widen it to the whole branch.
      - run: scripts/ros-validate.sh ${{ github.event.pull_request.base.sha || github.event.before }}
