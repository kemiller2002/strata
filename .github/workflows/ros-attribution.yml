name: Temporary ROS upgrade attribution

on:
  push:
    branches:
      - "chore/echelon-capabilities-2026-09-21"

permissions:
  contents: write

jobs:
  attribute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "chore/echelon-capabilities-2026-09-21"
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record upgrade work through ROS
        shell: bash
        env:
          ROS_ACTOR: agent:chatgpt
        run: |
          set -euo pipefail
          git fetch origin main
          export ROS_BASE_REF=origin/main
          work_id="ECHELON-UPGRADE-2026-09-21"
          ./ros add "Reconcile current Echelon engineering capabilities"             --id "$work_id"             --tag tooling,ordo,ros,limen             --priority high             --source agent-discovery             --source-reference "public-repository-upgrade-2026-09-21"
          ./ros work ready "$work_id"
          ./ros work start "$work_id" --type mechanical
          ./ros work done "$work_id"
          ./ros validate

      - name: Commit ROS attribution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Echelon Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git reset ".github/workflows/ros-attribution.yml"
          if git diff --cached --quiet; then
            echo "No attribution state changed."
            exit 0
          fi
          git commit -m "chore: attribute Echelon capability reconciliation"
          git push origin HEAD:"chore/echelon-capabilities-2026-09-21"
