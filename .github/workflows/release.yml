name: Native Strata release

# Publishes self-contained `strata` executables, the way Ordo's and Praxis's
# native releases are published (echelon-registry
# spec/ecosystem-release-workflow-requirements.md):
#
#   - one archive per supported runtime, each holding a single self-contained
#     `strata` executable (no .NET runtime needed on the consuming machine);
#   - native-checksums.txt, SHA-256 of the exact uploaded bytes;
#   - echelon-release.json, the echelon.release/v2 manifest generated by the
#     Registry's release-contract action from those same bytes and validated
#     against the Registry schema before anything is published;
#   - Sigstore-backed GitHub build-provenance attestations for every asset.
#
# The version source is <Version> in Directory.Build.props. A push to main that
# changes it publishes `v<version>`; a dispatch from main publishes the current
# version if it is not out yet. A version already published is never replaced:
# releases are immutable, so a rebuild that differs is refused and the version
# must be bumped. Pull requests run every job except publication, so a packaging
# regression is caught before anything ships.
#
# Supported runtimes are those Strata's PostgreSQL parser (pgsqlparser, which
# bundles libpg_query) ships a native library for: linux-x64, osx-x64,
# osx-arm64 and win-x64. It has none for linux-arm64 or musl, so Strata does
# not claim them; a binary for them would fail on the first SQL it parsed.

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "release/**"
      - "scripts/smoke-native-release.sh"
      - "Directory.Build.props"
      - "src/**"
  push:
    branches: [main]
    paths:
      - "Directory.Build.props"
      - ".github/workflows/release.yml"
      - "release/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: strata-native-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # The Registry commit whose release-contract action and schema this uses.
  ECHELON_REGISTRY_REF: abb470a2bf3cf838e4f4324c3b5c4f6fdfcfea0a

jobs:
  version:
    name: Resolve the release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        shell: bash
        run: |
          set -euo pipefail
          declared=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if ! [[ "$declared" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Directory.Build.props declares '$declared', not an X.Y.Z release version."; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are published from main only, not $GITHUB_REF."; exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"

  test:
    name: Build and test
    needs: version
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: ./scripts/build.sh
      - name: Build the live test fixture
        run: ./scripts/test-fixture.sh
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
      # A release is never cut from a run that skipped tests: the live
      # PostgreSQL tests skip silently without a connection, which would look
      # exactly like success.
      - name: Test
        env:
          STRATA_TEST_PG: Host=localhost;Port=5432;Database=strata_test;Username=strata;Password=strata_local_test
        run: |
          set -uo pipefail
          output=$(dotnet test Strata.sln -c Release --no-build 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if echo "$output" | grep -qE 'Skipped:[[:space:]]*[1-9]'; then
            echo "::error::Tests were skipped. The live PostgreSQL tests did not run, so this is not a pass."
            exit 1
          fi

  build:
    name: Build native release artifacts
    needs: [version, test]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained single-file executables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/native
          for rid in linux-x64 osx-x64 osx-arm64 win-x64; do
            dotnet publish src/Strata.Cli/Strata.Cli.fsproj -c Release -r "$rid" --self-contained true \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:DebugType=none -p:SourceRevisionId="$GITHUB_SHA" -o "publish/$rid"
            if [ "$rid" = "win-x64" ]; then
              (cd "publish/$rid" && zip -q "../../dist/native/strata-$rid.zip" strata.exe)
              test "$(unzip -Z1 "dist/native/strata-$rid.zip")" = "strata.exe"
            else
              chmod +x "publish/$rid/strata"
              tar -C "publish/$rid" -czf "dist/native/strata-$rid.tar.gz" strata
              test "$(tar -tzf "dist/native/strata-$rid.tar.gz")" = "strata"
            fi
          done
          (cd dist/native && sha256sum strata-* > native-checksums.txt)
          cat dist/native/native-checksums.txt

      # linux-x64 is the runtime this runner can execute, so it is unpacked
      # from its archive (the bytes that ship) and exercised, including the
      # bundled native parser.
      - name: Smoke-test the packaged linux-x64 executable
        shell: bash
        env:
          STRATA_SMOKE_PG: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
        run: |
          set -euo pipefail
          unpacked=$(mktemp -d)
          tar -xzf dist/native/strata-linux-x64.tar.gz -C "$unpacked"
          scripts/smoke-native-release.sh "$unpacked/strata" "$VERSION" "$GITHUB_SHA"

      - name: Generate the Echelon release manifest
        uses: kemiller2002/echelon-registry/actions/release-contract@abb470a2bf3cf838e4f4324c3b5c4f6fdfcfea0a
        with:
          release-input: release/echelon.release-input.json
          artifact-dir: dist/native
          output: dist/native/echelon-release.json
          version: ${{ needs.version.outputs.version }}
          tag: v${{ needs.version.outputs.version }}
          commit: ${{ github.sha }}
          release-stage: stable

      - name: Validate the release manifest against the Registry schema
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check jsonschema
          curl -fsSL "https://raw.githubusercontent.com/kemiller2002/echelon-registry/${ECHELON_REGISTRY_REF}/schemas/release-manifest-v2.schema.json" -o "$RUNNER_TEMP/release-manifest-v2.schema.json"
          python3 - "$RUNNER_TEMP/release-manifest-v2.schema.json" dist/native/echelon-release.json <<'PY'
          import json, sys, hashlib, pathlib
          from jsonschema import Draft202012Validator
          schema = json.load(open(sys.argv[1]))
          manifest = json.load(open(sys.argv[2]))
          Draft202012Validator(schema).validate(manifest)
          for artifact in manifest["artifacts"]:
              digest = hashlib.sha256(pathlib.Path("dist/native", artifact["name"]).read_bytes()).hexdigest()
              assert digest == artifact["sha256"], f"{artifact['name']}: manifest {artifact['sha256']} != file {digest}"
          print(json.dumps(manifest, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: strata-native-${{ needs.version.outputs.version }}
          path: dist/native
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: [version, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: strata-native-${{ needs.version.outputs.version }}
          path: dist/native

      - name: Verify the artifacts against their checksums
        working-directory: dist/native
        run: sha256sum -c native-checksums.txt

      # A published version's assets are immutable: consumers pin a version and
      # verify its digest. A run for a version that is already out publishes
      # nothing rather than replacing it.
      - name: Decide whether this version still needs publishing
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::v${VERSION} is already published. Released versions are immutable; bump <Version> to publish a new build. Nothing was uploaded."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest build provenance
        if: steps.release.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/native/strata-*
            dist/native/native-checksums.txt
            dist/native/echelon-release.json

      - name: Create the GitHub release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          notes="Strata ${VERSION} built from ${GITHUB_SHA}: self-contained \`strata\` executables (no .NET runtime required) for linux-x64, osx-x64, osx-arm64 and win-x64, their SHA-256 checksums, and the Echelon release manifest. Every asset carries a GitHub build-provenance attestation (\`gh attestation verify <asset> --repo ${GITHUB_REPOSITORY}\`). Strata implements the Echelon repository lifecycle contract v1."
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Strata v${VERSION}" --notes "$notes" \
            dist/native/strata-* dist/native/native-checksums.txt dist/native/echelon-release.json

      - name: Smoke-test the published release asset
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          check=$(mktemp -d)
          gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" --pattern strata-linux-x64.tar.gz --pattern native-checksums.txt --pattern echelon-release.json --dir "$check"
          (cd "$check" && grep ' strata-linux-x64.tar.gz$' native-checksums.txt | sha256sum -c -)
          cmp "$check/echelon-release.json" dist/native/echelon-release.json
          tar -xzf "$check/strata-linux-x64.tar.gz" -C "$check"
          "$check/strata" version
