# Build the code and run the tests, including the ones that need a real
# PostgreSQL.
#
# Until this existed, CI ran ROS validation and nothing else: no machine but
# the author's had ever compiled the F# or run a test. The live integration
# tests SKIP without a database, which reads as a green suite while testing
# nothing — so this stands one up and runs them for real. A run that skips them
# is not a run that passed them.

name: Build and test

# `pull_request` covers every commit on a PR branch and `push` covers the
# default branch. Listing both unqualified fires BOTH for a PR commit, which was
# tolerable when the only job took seven seconds and is not now that each run
# builds the solution and starts a database.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A run superseded by a newer push to the same branch is answering a question
# nobody is asking any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches the version developed against. The parser targets PostgreSQL
        # 17 grammar while the server is 16; RK-003 exists because those can
        # differ, so pinning the server here keeps CI honest about which it is.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        # `-U postgres` is not decoration: without it pg_isready connects as the
        # runner's own user and the server logs `FATAL: role "root" does not
        # exist` on every probe. The check still passed — the server was
        # answering — but a health check that cannot authenticate is not
        # checking health, and the noise hides a real failure if one ever
        # appears.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Release, not Debug. `dotnet build Strata.sln` silently produces Debug —
      # the solution metaproject passes Configuration=Debug as a global
      # property that Directory.Build.props cannot override — which is how two
      # evidence records came to be timed on an unoptimised build.
      - name: Build
        run: ./scripts/build.sh

      - name: Check the four-tier architecture
        run: ./scripts/check-semantic-architecture.sh

      - name: Check every resolved field reaches the diff
        run: ./scripts/check-resolved-state-wiring.sh

      - name: Check the docs still match the CLI
        run: ./scripts/check-docs-match-cli.sh

      - name: Build the live test fixture
        run: ./scripts/test-fixture.sh
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres

      # `dotnet test` fails the step on a failing test by itself. What it does
      # NOT do is fail on a SKIPPED one — and the live PostgreSQL tests skip
      # silently when the connection string is missing or wrong, which would
      # look exactly like success. A run that skips them is not a run that
      # passed them, so this checks.
      - name: Test
        env:
          STRATA_TEST_PG: Host=localhost;Port=5432;Database=strata_test;Username=strata;Password=strata_local_test
        run: |
          set -uo pipefail
          output=$(dotnet test Strata.sln -c Release --no-build 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if echo "$output" | grep -qE 'Skipped:[[:space:]]*[1-9]'; then
            echo "::error::Tests were skipped. The live PostgreSQL tests did not run, so this is not a pass."
            exit 1
          fi

  echelon-capability-rollout:
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "chore/echelon-capabilities-2026-09-21"
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install or upgrade SDE 1.3.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/kemiller2002/state-directed-engineering.git "$RUNNER_TEMP/sde-source"
          (cd "$RUNNER_TEMP/sde-source/distribution" && npm run build:payload)
          if [[ -d .sde || -f .echelon/sde.json ]]; then cmd=upgrade; else cmd=init; fi
          SDE_PAYLOAD_DIR="$RUNNER_TEMP/sde-source/distribution/dist" dotnet run --project "$RUNNER_TEMP/sde-source/src/Sde.Cli/Sde.Cli.fsproj" -c Release -- "$cmd"
          SDE_PAYLOAD_DIR="$RUNNER_TEMP/sde-source/distribution/dist" dotnet run --project "$RUNNER_TEMP/sde-source/src/Sde.Cli/Sde.Cli.fsproj" -c Release -- verify

      - name: Install or upgrade ROS 3.1.1
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/kemiller2002/repository-operating-system.git "$RUNNER_TEMP/ros-source"
          profile=greenfield
          if [[ -f .echelon/ros.json ]]; then
            profile="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(".echelon/ros.json","utf8"));process.stdout.write(x.profile||"greenfield")')"
            cmd=init
          elif [[ -f .ros/installation.json ]]; then
            profile="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(".ros/installation.json","utf8"));process.stdout.write(x.profile||"greenfield")')"
            cmd=upgrade
          else
            cmd=init
          fi
          echo "ROS_PROFILE=$profile" >> "$GITHUB_ENV"
          dotnet run --project "$RUNNER_TEMP/ros-source/src/Ros.Cli/Ros.Cli.fsproj" -c Release -- "$cmd" --profile "$profile"

      - name: Install or upgrade Visual Engineering 1.0.0
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .echelon/visual-engineering.json ]]; then cmd=upgrade; else cmd=init; fi
          npx --yes @echelon-foundry/visual-engineering@1.0.0 "$cmd"

      - name: Install or upgrade Communication Engineering 1.0.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/kemiller2002/communication-engineering.git "$RUNNER_TEMP/communication-engineering-source"
          if [[ -f .echelon/communication-engineering.json ]]; then cmd=upgrade; else cmd=init; fi
          node "$RUNNER_TEMP/communication-engineering-source/bin/communication-engineering.mjs" "$cmd"

      - name: Install or upgrade Limen 0.6.1
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f limen.config.json ]]; then
            printf '%s\n' '{"configurationVersion":1,"boundary":{"engine":[],"kernel":[]}}' > limen.config.json
          fi
          if [[ -f .echelon/limen.json ]]; then cmd=upgrade; else cmd=init; fi
          npx --yes @echelon-foundry/typescript-wasm-kernel@0.6.1 "$cmd"

      - name: Verify combined final state
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project "$RUNNER_TEMP/ros-source/src/Ros.Cli/Ros.Cli.fsproj" -c Release -- init --profile "$ROS_PROFILE"
          dotnet run --project "$RUNNER_TEMP/ros-source/src/Ros.Cli/Ros.Cli.fsproj" -c Release -- verify --strict
          SDE_PAYLOAD_DIR="$RUNNER_TEMP/sde-source/distribution/dist" dotnet run --project "$RUNNER_TEMP/sde-source/src/Sde.Cli/Sde.Cli.fsproj" -c Release -- verify
          npx --yes @echelon-foundry/visual-engineering@1.0.0 verify --strict
          node "$RUNNER_TEMP/communication-engineering-source/bin/communication-engineering.mjs" verify --strict
          npx --yes @echelon-foundry/typescript-wasm-kernel@0.6.1 verify --strict

      - name: Commit non-workflow rollout state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Echelon Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout HEAD -- .github/workflows
          git add -A
          git reset .github/workflows
          if git diff --cached --quiet; then
            echo "No non-workflow repository changes required."
            exit 0
          fi
          git commit -m "chore: install current Echelon engineering capabilities"
          git push origin HEAD:"chore/echelon-capabilities-2026-09-21"
